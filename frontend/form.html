<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wi-fi spot</title>

    <link rel="stylesheet" href="css/form.css"/>

</head>
<body>

                        
<div class="form-overlay">    
    <div class="form-container">
                                <h1>Add Wi-Fi Spot</h1>
        <form action="#" method="post">
                    
                    <div class="form-group">
                        <label for="fname"> First-Name: </label><br>
                        <input type="text" id="fname" name="fname" placeholder="Eg: Ayeyemi" required><br>
                    </div>


                    <div class="form-group">
                        <label for="lname"> Last-Name: </label><br>
                        <input type="text" id="lname" name="lname" placeholder="Eg: Ayeni" required><br>      
                    </div>


                    <div class="form-group">
                        <label for="email"> Email: </label><br>
                        <input type="email" id="email" name="email" placeholder="Eg: ayeni@gmail.com" required><br>      
                    </div>


                    <div class="form-group">
                        <label for="ssid"> WI-FI Name: </label><br>
                        <input type="text" id="ssid" name="ssid" placeholder="Eg: ayeyemi_EXT" required><br>        
                    </div>


                    <div class="form-group">
                        <label for="Pword"> WI-FI Password: </label><br>
                        <input type="password" id="Pword" name="Pword" placeholder="Eg: password123@" required><br>
                    </div>

                    <div class="form-group">
                        <label for="state"> choose a city:</label>
                        <select id="state" name="state">
                            <option value="lagos" required> Lagos </option>
                            <option value="Port-Harcourt" required> Port-Harcourt </option>
                            <option value="Delta" required> Delta </option>
                        </select>
                    
                    </div>
                    
                     <button type="submit">Submit WiFi Spot</button>


        </form>
    </div>
</div>
        
</body>
</html>
